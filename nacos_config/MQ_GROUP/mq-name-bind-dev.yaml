mq:
  name:
    bind:
      error-exchange:
        exchange-name: errorExchange
        type: fanout
        error-queue:
          name: errorQueue
          routing-key: null
      user-exchange:
        exchange-name: userExchange
        type: direct
        register-fund-queue:
          name: userRegisterFundQueue
          routing-key: register
        update-file-user-queue:
          name: updateFileUserQueue
          routing-key: file
        delete-fund-queue:
          name: deleteFundQueue
          routing-key: delete

