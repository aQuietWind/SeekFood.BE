spring:
  application:
    name: Admin
  profiles:
    active: dev # 环境：dev/test/prod
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848   #nacos地址
        password: nacos   #密码
        username: nacos   #用户名
        # 配置文件后缀，yaml/properties
        file-extension: yaml
        # 命名空间，隔离环境，默认public
        namespace: dev-seek-food-id
        # 分组，默认DEFAULT_GROUP，区分业务模块
        group: SEEK_FOOD_GROUP
        # 开启自动刷新配置（动态更新无需重启服务）
        refresh-enabled: true
        prefix: seek-food
        # 关闭import强制校验
        import-check:
          enabled: false
        # 扩展配置（多配置文件场景，数据库、redis分开配置）
        extension-configs:
#          - data-id: demo-db-dev.yml
#            group: SEEK_FOOD_GROUP
#            refresh: true # 该文件支持动态刷新
          - data-id: common-redis-dev
            group: SEEK_FOOD_GROUP
            refresh: true












